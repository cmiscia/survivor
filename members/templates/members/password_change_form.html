{% extends 'registration/auth_panel.html' %}
{% block auth_content %}
<h1 id="auth-title">Change password</h1>
<p>Enter your current password, then choose a new one.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary w-100" type="submit">Change password</button>
</form>
{% endblock %}
