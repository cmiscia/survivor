{% extends 'registration/auth_panel.html' %}
{% block auth_content %}
<h1 id="auth-title">Forgot your password?</h1>
<p>Enter the email address associated with your league account. This also works if you need a new invitation link.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary w-100" type="submit">Send password link</button>
</form>
<p class="mt-3"><a href="{% url 'login' %}">Back to login</a></p>
{% endblock %}
